name: Build Brick HW Test

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -e

          mkdir -p Brick.HW.Test.pak

          echo "Compiler:"
          aarch64-nextui-linux-gnu-gcc --version

          echo "Building ALSA-only test..."

          aarch64-nextui-linux-gnu-gcc \
            -O2 \
            -o Brick.HW.Test.pak/hwtest.elf \
            src/main.c \
            -lasound

          chmod +x Brick.HW.Test.pak/hwtest.elf
          chmod +x Brick.HW.Test.pak/launch.sh

      - name: Package
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path("Brick.HW.Test.pak")
          output = Path("Brick.HW.Test.pak.zip")

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))

          print("Created:", output)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brick.HW.Test.pak
          path: Brick.HW.Test.pak.zip
