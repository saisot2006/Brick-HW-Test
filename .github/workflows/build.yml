- name: Build
  shell: bash
  run: |
    set -e
    mkdir -p Brick.HW.Test.pak

    SDL_CFLAGS="$(sdl-config --cflags)"
    SDL_LIBS="$(sdl-config --libs)"

    ${CC:-aarch64-nextui-linux-gnu-gcc} \
      $SDL_CFLAGS \
      -O2 \
      -o Brick.HW.Test.pak/hwtest.elf \
      src/main.c \
      $SDL_LIBS \
      -lasound

    chmod +x Brick.HW.Test.pak/launch.sh
    chmod +x Brick.HW.Test.pak/hwtest.elf